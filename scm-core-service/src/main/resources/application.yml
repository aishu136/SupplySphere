server:
  port: 8080

spring:
  application:
    name: scm-core-service
  datasource:
    url: jdbc:h2:mem:scm;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

camel:
  springboot:
    name: scm-camel

management:
  endpoints:
    web:
      exposure:
        include: health,info,camelroutes

scm:
  kafka:
    # false = run without a broker (events are logged, alerts raised locally)
    enabled: ${SCM_KAFKA_ENABLED:false}
  topics:
    inventory: scm.inventory.events
    orders: scm.order.events
    shipments: scm.shipment.events
    alerts: scm.alerts
    vision: scm.vision.events
  feeds:
    inbox: ${SCM_FEEDS_INBOX:data/inbox/supplier-feeds}
  cors:
    allowed-origins: ${SCM_CORS_ORIGINS:http://localhost:4200}
