name: scm

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-opus-5}

services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: scm
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scm
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: scm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm"]
      interval: 5s
      retries: 10

  scm-core:
    build: ./scm-core-service
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SCM_CORS_ORIGINS: http://localhost:4200,http://localhost:8081
    volumes: [./data/inbox:/data/inbox]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/actuator/health || exit 1"]
      interval: 10s
      retries: 20

  flink-jobmanager:
    image: flink:1.20.1-java17
    command: jobmanager
    ports: ["8082:8081"]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

  flink-taskmanager:
    image: flink:1.20.1-java17
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  # One-shot: submits the alerting job once Kafka topics exist (created by scm-core).
  flink-job-submitter:
    image: flink:1.20.1-java17
    command: ["flink", "run", "-d", "-m", "flink-jobmanager:8081", "/opt/jobs/scm-stream-processor-1.0.0.jar"]
    volumes: [./scm-stream-processor/target:/opt/jobs:ro]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      scm-core: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }
    restart: on-failure

  scm-mcp:
    build: ./scm-ai-service
    command: ["python", "-m", "app.mcp_server"]
    ports: ["8001:8001"]
    environment:
      <<: *aws-env
      SCM_API_URL: http://scm-core:8080
    volumes: [~/.aws:/root/.aws:ro, ai-data:/app/data]
    depends_on: [scm-core]

  scm-ai:
    build: ./scm-ai-service
    ports: ["8000:8000"]
    environment:
      <<: *aws-env
      SCM_API_URL: http://scm-core:8080
      SCM_MCP_URL: http://scm-mcp:8001/mcp
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes: [~/.aws:/root/.aws:ro, ai-data:/app/data]
    depends_on: [scm-mcp, kafka]

  scm-ui:
    build: ./scm-ui
    ports: ["8081:80"]
    depends_on: [scm-core, scm-ai]

volumes:
  pgdata:
  ai-data:   # FAISS index + trained RL policies, shared by scm-ai and scm-mcp
