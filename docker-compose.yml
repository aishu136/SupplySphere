name: scm

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-opus-5}

# Shared settings for the Spring Boot microservices (built from scm-platform/Dockerfile).
x-java-service: &java-service
  environment: &java-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    DB_USER: scm
    DB_PASSWORD: scm
    JAVA_TOOL_OPTIONS: -Xmx384m
  healthcheck:
    test: ["CMD-SHELL", "curl -fs localhost:$${PORT}/actuator/health || exit 1"]
    interval: 10s
    retries: 30
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- infrastructure
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: scm
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # One Postgres server, one database per service (see scripts/postgres-init.sql).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: scm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm"]
      interval: 5s
      retries: 10

  # Distributed tracing: every service exports OpenTelemetry spans (HTTP + Kafka) here.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ---------------------------------------------------------------- domain microservices
  catalog-service:
    <<: *java-service
    build: { context: ./scm-platform, args: { SERVICE: catalog-service } }
    environment:
      <<: *java-env
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/catalog

  inventory-service:
    <<: *java-service
    build: { context: ./scm-platform, args: { SERVICE: inventory-service } }
    environment:
      <<: *java-env
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      SCM_FEEDS_INBOX: /data/inbox/supplier-feeds
    volumes: [./data/inbox:/data/inbox]

  order-service:
    <<: *java-service
    build: { context: ./scm-platform, args: { SERVICE: order-service } }
    environment:
      <<: *java-env
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/orders
      CATALOG_URL: http://catalog-service:8081

  shipment-service:
    <<: *java-service
    build: { context: ./scm-platform, args: { SERVICE: shipment-service } }
    environment:
      <<: *java-env
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/shipments
      ORDER_URL: http://order-service:8083

  alert-service:
    <<: *java-service
    build: { context: ./scm-platform, args: { SERVICE: alert-service } }
    environment:
      <<: *java-env
      PORT: 8085

  api-gateway:
    <<: *java-service
    build: { context: ./scm-platform, args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      <<: *java-env
      PORT: 8080
      CATALOG_URL: http://catalog-service:8081
      INVENTORY_URL: http://inventory-service:8082
      ORDER_URL: http://order-service:8083
      SHIPMENT_URL: http://shipment-service:8084
      ALERT_URL: http://alert-service:8085
      SCM_CORS_ORIGINS: http://localhost:4200,http://localhost:8081
    depends_on:
      kafka: { condition: service_healthy }

  # ---------------------------------------------------------------- stream processing
  flink-jobmanager:
    image: flink:1.20.1-java17
    command: jobmanager
    ports: ["8082:8081"]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    healthcheck:
      # REST API up (the image has bash but not curl).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 5s
      retries: 30

  flink-taskmanager:
    image: flink:1.20.1-java17
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  # One-shot: submits the alerting job once the services have created the Kafka topics.
  flink-job-submitter:
    image: flink:1.20.1-java17
    command: ["flink", "run", "-d", "-m", "flink-jobmanager:8081", "/opt/jobs/scm-stream-processor-1.0.0.jar"]
    volumes: [./scm-stream-processor/target:/opt/jobs:ro]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      inventory-service: { condition: service_healthy }
      flink-jobmanager: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }
    restart: on-failure

  # ---------------------------------------------------------------- AI + UI
  scm-mcp:
    build: ./scm-ai-service
    command: ["python", "-m", "app.mcp_server"]
    ports: ["8001:8001"]
    environment:
      <<: *aws-env
      SCM_API_URL: http://api-gateway:8080
    volumes: [~/.aws:/root/.aws:ro, ai-data:/app/data]
    depends_on: [api-gateway]

  scm-ai:
    build: ./scm-ai-service
    ports: ["8000:8000"]
    environment:
      <<: *aws-env
      SCM_API_URL: http://api-gateway:8080
      SCM_MCP_URL: http://scm-mcp:8001/mcp
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes: [~/.aws:/root/.aws:ro, ai-data:/app/data]
    healthcheck:
      # The slim Python image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')"]
      interval: 10s
      retries: 30
    depends_on:
      scm-mcp: { condition: service_started }
      kafka: { condition: service_healthy }

  scm-ui:
    build: ./scm-ui
    ports: ["8081:80"]
    depends_on: [api-gateway, scm-ai]

volumes:
  pgdata:
  ai-data:   # vector index + trained RL policies, shared by scm-ai and scm-mcp
