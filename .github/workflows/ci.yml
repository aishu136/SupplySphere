name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Microservices (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scm-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and package all services (embedded Kafka)
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-reports
          path: scm-platform/*/build/reports/tests/

  stream-processor:
    name: Stream processor (Flink)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scm-stream-processor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build job jar
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: scm-stream-processor-jar
          path: scm-stream-processor/build/libs/scm-stream-processor-*.jar
          retention-days: 7

  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scm-ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scm-ai-service/requirements.txt
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies (CPU-only PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Run tests
        # Tests stub YOLO, embeddings and the core API, so no AWS credentials or model downloads are needed.
        run: pytest -q

  ui:
    name: UI (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scm-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scm-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (strict template type-check)
        run: npx ng build

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: catalog-service, context: scm-platform, dockerfile: scm-platform/Dockerfile, platforms: linux/amd64, service: catalog-service }
          - { image: inventory-service, context: scm-platform, dockerfile: scm-platform/Dockerfile, platforms: linux/amd64, service: inventory-service }
          - { image: order-service, context: scm-platform, dockerfile: scm-platform/Dockerfile, platforms: linux/amd64, service: order-service }
          - { image: shipment-service, context: scm-platform, dockerfile: scm-platform/Dockerfile, platforms: linux/amd64, service: shipment-service }
          - { image: alert-service, context: scm-platform, dockerfile: scm-platform/Dockerfile, platforms: linux/amd64, service: alert-service }
          - { image: api-gateway, context: scm-platform, dockerfile: scm-platform/Dockerfile, platforms: linux/amd64, service: api-gateway }
          - image: scm-ai
            context: scm-ai-service
            dockerfile: scm-ai-service/Dockerfile
            platforms: linux/amd64
          - image: scm-agentcore
            context: scm-ai-service
            dockerfile: scm-ai-service/Dockerfile.agentcore
            platforms: linux/arm64  # AgentCore Runtime runs ARM64 containers
          - image: scm-ui
            context: scm-ui
            dockerfile: scm-ui/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU (ARM64 emulation)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: [platform, stream-processor, ai-service]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build Flink job jar
        run: scm-stream-processor/gradlew -q -p scm-stream-processor shadowJar
      - name: Start infrastructure and microservices
        run: >
          docker compose up -d --build --wait --wait-timeout 600
          kafka postgres jaeger
          catalog-service inventory-service order-service shipment-service alert-service api-gateway
          flink-jobmanager flink-taskmanager
          scm-ai
      - name: Submit Flink job
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose run --rm flink-job-submitter && exit 0
            echo "Submission attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "::error title=Flink job submission::failed after 5 attempts"
          exit 1
      - name: Run end-to-end checks
        run: bash scripts/e2e-smoke.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Failure diagnostics as annotations
        # Annotations are readable through the public checks API, unlike raw job logs.
        if: failure()
        run: |
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/'%0D'}"; s="${s//$'\n'/'%0A'}"; printf '%s' "$s"; }
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' > /tmp/ps.txt || true
          echo "::error title=compose ps::$(esc "$(cat /tmp/ps.txt)")"
          for svc in scm-ai flink-jobmanager api-gateway order-service inventory-service shipment-service alert-service catalog-service; do
            logs=$(docker compose logs --no-color --no-log-prefix --tail=25 "$svc" 2>&1 | cut -c1-300)
            echo "::error title=$svc logs::$(esc "$logs")"
          done
      - name: Stop stack
        if: always()
        run: docker compose down -v

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
