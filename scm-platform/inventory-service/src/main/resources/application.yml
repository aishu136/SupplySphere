server:
  port: ${PORT:8082}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

scm:
  feeds:
    inbox: ${SCM_FEEDS_INBOX:data/inbox/supplier-feeds}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,camelroutes
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.apache.kafka: WARN
