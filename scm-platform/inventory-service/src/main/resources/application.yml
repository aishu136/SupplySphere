server:
  port: ${PORT:8082}

spring:
  application:
    name: inventory-service
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    keyspace-name: inventory
    schema-action: create-if-not-exists
    request:
      timeout: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

scm:
  feeds:
    inbox: ${SCM_FEEDS_INBOX:data/inbox/supplier-feeds}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,camelroutes
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.apache.kafka: WARN
