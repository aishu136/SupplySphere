server:
  port: ${PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  cloud:
    circuitbreaker:
      # Run calls on the caller's thread so trace context and timeouts come from the HTTP client.
      resilience4j:
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false

scm:
  services:
    catalog-url: ${CATALOG_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.apache.kafka: WARN
