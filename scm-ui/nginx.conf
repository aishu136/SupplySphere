server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # Server-sent events: no buffering, long-lived connection.
    location /api/alerts/stream {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
    }

    # Dock door video clips (DOCK_DOOR_MAX_UPLOAD_MB in the AI service).
    location /ai/vision/dock-doors/analyze {
        proxy_pass http://scm-ai:8000;
        client_max_body_size 200m;
        proxy_read_timeout 600s;
    }

    location /ai/ {
        proxy_pass http://scm-ai:8000;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
